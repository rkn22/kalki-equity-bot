name: Kalki Trading Bot Execution

on:
  schedule:
    - cron: '30 3 * * 1-5'   # Morning Swing Call (9:00 AM IST)
    - cron: '45 3 * * 1-5'   # Intraday Calls (9:15 AM IST)
    - cron: '45 9 * * 1-5'   # BTST Call (3:15 PM IST)
  workflow_dispatch:          # Allows manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 1-Monthly Swing Call Analysis
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_MODE: "MONTHLY"
        run: python main.py

      - name: Execute 2-Intraday Cash Calls Analysis
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_MODE: "INTRADAY"
        run: python main.py

      - name: Execute 1-BTST Call Analysis
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_MODE: "BTST"
        run: python main.py
        
