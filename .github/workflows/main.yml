name: Kalki Trading Bot Execution

on:
  schedule:
    - cron: '30 3 * * 1-5'   # Morning Swing Call (9:00 AM IST)
    - cron: '45 3 * * 1-5'   # Intraday Calls (9:15 AM IST)
    - cron: '45 9 * * 1-5'   # BTST Call (3:15 PM IST)
  
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Select Trading Bot Mode to Execute'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - MONTHLY
          - INTRADAY
          - BTST

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Kalki Trading Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # If triggered manually via GitHub UI, use the selected input. Otherwise default to ALL for scheduled runs.
          RUN_MODE: ${{ github.event.inputs.run_mode || 'ALL' }}
        run: python main.py
        
